    /* Expressive character acting for Harbor Whispers' original story scenes. */
    .story-backdrop { animation: story-world-drift 20s ease-in-out infinite alternate; }
    .story-advance .story-character { will-change: transform; }
    .story-advance.right .story-character { animation: story-enter-from-right .58s cubic-bezier(.2,.8,.25,1.15) both; }
    .story-advance.left .story-character { animation: story-enter-from-left .58s cubic-bezier(.2,.8,.25,1.15) both; }
    .story-advance .story-character img { transform-origin: 50% 92%; will-change: transform; animation-duration: 2.35s; animation-delay: .48s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .story-advance.speaker-mae .story-character img { animation-name: mae-story-gesture; }
    .story-advance.speaker-theo .story-character img { animation-name: theo-story-nod; }
    .story-advance.speaker-iris .story-character img { animation-name: iris-story-lean; }
    .story-advance .story-character b { animation: story-nameplate-arrive .38s .24s both; }
    .story-bubble { transform-origin: 50% 85%; animation: story-bubble-arrive .42s cubic-bezier(.2,.8,.3,1.12) both; }
    @keyframes story-world-drift { from { transform: scale(1.05) translateX(-.4%); } to { transform: scale(1.09) translateX(.6%); } }
    @keyframes story-enter-from-right { from { opacity: 0; transform: translate(24px,14px) scale(.92); } to { opacity: 1; transform: translate(0,0) scale(1); } }
    @keyframes story-enter-from-left { from { opacity: 0; transform: translate(-24px,14px) scale(.92); } to { opacity: 1; transform: translate(0,0) scale(1); } }
    @keyframes story-nameplate-arrive { from { opacity: 0; transform: translateY(8px) scale(.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes story-bubble-arrive { from { opacity: 0; transform: translateY(13px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes mae-story-gesture { 0%,100% { transform: translateY(0) rotate(0) scale(1); } 28% { transform: translateY(-3px) rotate(-1.2deg) scale(1.012); } 54% { transform: translateY(0) rotate(.8deg) scale(1); } 78% { transform: translateY(-1px) rotate(0) scale(1.006); } }
    @keyframes theo-story-nod { 0%,100% { transform: translateY(0) rotate(0); } 32% { transform: translateY(-2px) rotate(1.5deg); } 57% { transform: translateY(1px) rotate(-1deg); } 78% { transform: translateY(0) rotate(.5deg); } }
    @keyframes iris-story-lean { 0%,100% { transform: translateY(0) rotate(0) scale(1); } 30% { transform: translateY(-2px) rotate(-1deg) scale(1.012); } 58% { transform: translateY(0) rotate(1deg) scale(1); } 82% { transform: translateY(-1px) rotate(0) scale(1.006); } }
    .repair-character { transform-origin: 55% 94%; will-change: transform,opacity; animation: repair-character-arrive .7s cubic-bezier(.18,.72,.25,1.12) both; }
    .repair-scene[data-beat="1"] .repair-character { animation: repair-character-work 1.05s ease-in-out infinite; }
    .repair-scene[data-beat="2"] .repair-character { animation: repair-character-celebrate .92s cubic-bezier(.2,.8,.25,1.16) both; }
    .repair-scene[data-beat="1"] .repair-action-stamp { animation: repair-action-pop .42s cubic-bezier(.2,.8,.25,1.25) both, repair-action-bob 1.15s ease-in-out .42s infinite; }
    .repair-scene[data-beat="1"] .repair-film-speech { animation: repair-speech-arrive .36s ease-out both; }
    .repair-scene[data-beat="2"] .repair-film-speech { animation: repair-speech-arrive .4s ease-out both; }
    .repair-cafe[data-beat="1"] .repair-character { animation-name: repair-sweep; }
    .repair-pier[data-beat="1"] .repair-character { animation-name: repair-haul; }
    .repair-garden[data-beat="1"] .repair-character { animation-name: repair-plant; }
    .repair-office[data-beat="1"] .repair-character { animation-name: repair-write; }
